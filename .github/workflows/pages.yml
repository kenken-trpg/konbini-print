name: Pages

# ブラウザ版（client/）を GitHub Pages に公開する。
# 公開するのは client/ 配下だけ（tests/・fixtures/・package.json は除く）。
on:
  push:
    branches: [master]
    paths:
      - "client/**"
      - "src/domain/domain.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ブラウザ版のテスト
        working-directory: client
        run: npm test
      - name: domain.json が本線と一致するか
        run: |
          python3 - <<'PY'
          import json, sys
          main = json.load(open("src/domain/domain.json", encoding="utf-8"))
          client = json.load(open("client/domain.json", encoding="utf-8"))
          if main != client:
              sys.exit("client/domain.json が src/domain/domain.json と異なります。コピーしてください。")
          PY
      - name: 公開ファイルをまとめる
        run: |
          rsync -a \
            --exclude tests/ \
            --exclude fixtures/ \
            --exclude package.json \
            client/ _site/
          ls -R _site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
